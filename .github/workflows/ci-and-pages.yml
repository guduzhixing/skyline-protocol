name: CI Verification & GitHub Pages Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-build-and-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Dual Presets (Showcase + Pure Open)
        run: |
          npm run build:all
          npm run check

      - name: Run Chrome Headless WebGL2 5-Matrix CDP QA
        run: |
          CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -n "$CHROME_BIN" ]; then
            echo "Detected browser: $("$CHROME_BIN" --version || true)"
            if command -v xvfb-run >/dev/null 2>&1; then
              CHROME_PATH="$CHROME_BIN" xvfb-run -a npm run qa
            else
              CHROME_PATH="$CHROME_BIN" npm run qa
            fi
          else
            echo "::warning::No Chrome/Chromium binary available on runner; skipped WebGL2 CDP QA"
          fi

      - name: Upload Build & QA Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skyline-protocol-builds
          path: |
            index.html
            dist/skyline-protocol-standalone.html
            dist/skyline-protocol-open.html
            docs/benchmarks/latest-qa-report.json

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-build-and-qa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout built site
        uses: actions/checkout@v4

      - name: Rebuild cleanly before publish
        run: npm run build:all && npm run check

      - name: Prepare static Pages bundle
        run: |
          mkdir -p _site/dist _site/docs/showcase
          cp index.html _site/index.html
          cp dist/skyline-protocol-open.html _site/dist/skyline-protocol-open.html
          cp dist/skyline-protocol-standalone.html _site/dist/skyline-protocol-standalone.html
          cp docs/showcase/promo.html _site/docs/showcase/promo.html
          cp docs/showcase/skyline_protocol_promo_15s.mp4 _site/docs/showcase/skyline_protocol_promo_15s.mp4
          cp docs/showcase/skyline_protocol_promo_15s_poster.jpg _site/docs/showcase/skyline_protocol_promo_15s_poster.jpg
          cp docs/showcase/skyline_protocol_promo_15s_preview.webp _site/docs/showcase/skyline_protocol_promo_15s_preview.webp
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./docs/showcase/promo.html"><title>Skyline Protocol 15s Promo</title><a href="./docs/showcase/promo.html">Watch 15s Promo Video</a>\n' > _site/promo.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
